name: C milestone checks
on: [push, pull_request]
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libsqlite3-dev python3 xvfb xauth fonts-dejavu-core
      - name: Compile server, tests and GTK client
        run: make all
      - name: Rules, framing and storage
        run: make test
      - name: Two real TCP clients
        run: make integration
      - name: Two GTK windows against a real server
        run: make gui-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtk-screenshots
          path: build/gui-*.png
